name: cli

# The dude CLI's tests and its contract with the API's routes and schemas.
# No database, so no services.
on:
  pull_request:
    paths:
      - orchestrator/cmd/dude-cli/**
      - apps/control-plane/src/api/**
      - packages/domain/src/**
      - apps/control-plane/test/cli-*.test.ts
      - orchestrator/go.mod
      - orchestrator/go.sum
      - .github/workflows/cli.yml
  push:
    branches: [main]
    paths:
      - orchestrator/cmd/dude-cli/**
      - apps/control-plane/src/api/**
      - packages/domain/src/**
      - apps/control-plane/test/cli-*.test.ts
      - orchestrator/go.mod
      - orchestrator/go.sum
      - .github/workflows/cli.yml

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: go vet, linux and windows
        working-directory: orchestrator
        run: |
          go vet ./cmd/dude-cli/...
          GOOS=windows go vet ./cmd/dude-cli/...

      - name: go test
        working-directory: orchestrator
        run: go test -count=1 ./cmd/dude-cli/...

      - name: The CLI's routes and bodies against the API
        run: bun test ./apps/control-plane/test/cli-routes.test.ts ./apps/control-plane/test/cli-bodies.test.ts

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie  # memory needs pgvector
        env:
          POSTGRES_USER: dude
          POSTGRES_PASSWORD: dude
          POSTGRES_DB: dude
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dude"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: bun run dist
        run: VERSION="$GITHUB_REF_NAME" bun run dist

      # Before anything is published: the amd64 tarball, as an
      # operator would unpack it, runs on this (amd64) runner.
      - name: Smoke-test the release tarball
        env:
          VERSION: ${{ github.ref_name }}
          SMOKE_OWNER_URL: postgres://dude:dude@localhost:5432/dude
          SMOKE_APP_URL: postgres://dude_app:dude_app@localhost:5432/dude
        run: scripts/smoke-release.sh "dist/dude_${GITHUB_REF_NAME}_linux_amd64.tar.gz"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true

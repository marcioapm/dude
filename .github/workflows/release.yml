name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  RUNTIME_IMAGE: ghcr.io/marcioapm/dude-runtime

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: orchestrator/go.mod
          cache-dependency-path: orchestrator/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: bun run dist
        run: VERSION="$GITHUB_REF_NAME" bun run dist

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A plain manifest list (no attestations), so the digest names exactly
      # the two platform images agents pull.
      - name: Build and push the runtime image
        run: |
          PLATFORMS=linux/arm64,linux/amd64 VERSION="$GITHUB_REF_NAME" \
            scripts/runtime-image.sh --push --provenance=false --sbom=false \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            --metadata-file "$RUNNER_TEMP/runtime-image.json" \
            -t "$RUNTIME_IMAGE:$GITHUB_REF_NAME"
          digest="$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/runtime-image.json")"
          [[ "$digest" == sha256:* ]] || { echo "no digest in the build metadata: $digest" >&2; exit 1; }
          echo "$RUNTIME_IMAGE@$digest" > dist/runtime-image.txt
          cat dist/runtime-image.txt
          (cd dist && sha256sum dude_*.tar.gz runtime-image.txt > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/runtime-image.txt
            dist/SHA256SUMS
          generate_release_notes: true

[project]
name = "dude-e2e"
version = "0.0.0"
description = "Black-box E2E suite for the dude software factory"
# Python 3.14 per plan §52. The suite is a deliberate external client: it
# drives the deployed system through its public API and never imports the
# Bun implementation.
requires-python = ">=3.14"
dependencies = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    # The browser suites drive the system Chrome (see conftest.py).
    "playwright>=1.63",
    "pytest-playwright>=0.9",
    "boto3>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["suites"]
# No test should hang the suite; a stuck Run is a failure, not a pause.
timeout = 300
# thread, not signal: SIGALRM lands inside Playwright's sync dispatcher, kills its loop,
# and the fixture's teardown then waits on it until the CI job is killed with no result.
# thread dumps every stack and exits the test process at the timeout.
timeout_method = "thread"
addopts = "-ra --strict-markers"
markers = [
    "docker: requires Docker and the runner daemon",
]
